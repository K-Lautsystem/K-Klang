<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Deutsch → K‑Laut → Hangul → Deutsch</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; line-height: 1.6; }
    h1 { font-size: 1.6rem; }
    input { width: 100%; padding: 0.5rem; font-size: 1rem; }
    button { margin-top: 0.8rem; padding: 0.5rem 1rem; font-size: 1rem; }
    .block { margin-top: 1.2rem; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px; }
    .title { font-weight: bold; margin-bottom: 0.3rem; }
    code { font-family: Consolas, monospace; }
    table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.3rem 0.5rem; text-align: center; }
  </style>
</head>
<body>
<h1>K-Klang – Universelles Klangsystem</h1>
<h2>Deutsch → K‑Laut → Hangul → Deutsch</h2>

<p>Beispiel‑Kette: <code>Habe → h·a·b·e → ㅎ·ㅏ·ㅂ·ㅔ → 하베 → Habe</code></p>

<label>Deutsches Wort eingeben:</label>
<input id="wort" type="text" value="Habe">
<button onclick="umwandeln()">Umwandeln</button>

<div class="block">
  <div class="title">1. Deutsche Zerlegung</div>
  <div id="deutsch"></div>
</div>

<div class="block">
  <div class="title">2. K‑Buchstaben (Jamos)</div>
  <div id="kbuchstaben"></div>
</div>

<div class="block">
  <div class="title">3. Hangul (Silben)</div>
  <div id="hangul"></div>
</div>

<div class="block">
  <div class="title">4. Rückführung</div>
  <div id="zurueck"></div>
</div>

<h2>K‑Wort eingeben (z. B. ㅎㅏㅂㅔ)</h2>
<input id="kwort" type="text">
<button onclick="kwortUmwandeln()">Umwandeln</button>

<div class="block">
  <div class="title">K‑Buchstaben (Jamos)</div>
  <div id="kjamos"></div>
</div>

<div class="block">
  <div class="title">Hangul</div>
  <div id="deutschAusK"></div>
</div>

<div class="block">
  <div class="title">Deutsches Wort</div>
  <div id="wortAusK"></div>
</div>

<hr>

<script>
// ⭐ Deutsch + Französisch + jh‑Mapping
const mapDeutsch = {
  // Deutsch
  "h":"ㅎ","a":"ㅏ","b":"ㅂ","e":"ㅔ","t":"ㅌ","g":"ㄱ",
  "o":"ㅗ","u":"ㅜ","i":"ㅣ","ä":"ㅐ","ö":"ㅚ","ü":"ㅟ",

  // Französisch
  "n":"ㄴ",
  "r":"ㄹ",
  "m":"ㅁ",
  "f":"ㅍ",
  "s":"ㅅ",
  "z":"ㅈ",
  "j":"ㅈ",
  "c":"ㅈ",
  "p":"ㅂ",
  "l":"ㄹ",

  // Kombinationen
  "jh":"ㅈ",
  "ch":"ㅈ",
  "sh":"ㅅ",
  "oo":"ㅜ",
  "ou":"ㅜ",

  // Nasale
  "on":"옹",
  "an":"앙",
  "en":"엉",
  "in":"잉"
};

function umwandeln(){
  let w = document.getElementById("wort").value.toLowerCase();

  // 1. Zerlegung
  document.getElementById("deutsch").innerText = w.split("").join(" · ");

  // 2. K‑Buchstaben
  let k = w.split("").map(c => mapDeutsch[c] || "?");
  document.getElementById("kbuchstaben").innerText = k.join(" · ");

  // 3. Hangul
  document.getElementById("hangul").innerText = k.join("");

  // 4. Rückführung
  let rück = k.map(j => Object.keys(mapDeutsch).find(key => mapDeutsch[key]===j) || "?");
  document.getElementById("zurueck").innerText = rück.join("");
}

function kwortUmwandeln(){
  let k = document.getElementById("kwort").value.split("");

  document.getElementById("kjamos").innerText = k.join(" · ");

  let deutsch = k.map(j => Object.keys(mapDeutsch).find(key => mapDeutsch[key]===j) || "?");
  document.getElementById("wortAusK").innerText = deutsch.join("");

  document.getElementById("deutschAusK").innerText = k.join("");
}
</script>
</body>
</html>
