<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>K-Laut System</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}

input {
    font-size: 18px;
    padding: 5px;
}

button {
    font-size: 18px;
    padding: 8px 15px;
    margin: 5px;
    cursor: pointer;
}

pre {
    background: #eeeeee;
    padding: 15px;
    font-size: 18px;
    min-height: 25px;
}
</style>

</head>

<body>

<h1>K-Laut System</h1>


<h2>Deutsch → K-Laut</h2>

<input id="wort" value="Mul">

<button onclick="umwandeln()">Umwandeln</button>

<h3>Deutsch Zerlegung</h3>
<pre id="deutsch"></pre>

<h3>K-Buchstaben</h3>
<pre id="kbuchstaben"></pre>

<h3>Hangul</h3>
<pre id="hangul"></pre>

<h3>Rückführung</h3>
<pre id="zurueck"></pre>


<hr>


<h2>K-Wort Wörterbuch</h2>

<input id="kwort" placeholder="Wort eingeben">

<button onclick="sucheKWort()">K-Wort suchen</button>


<div style="margin-top:15px;">
<b>Beispiele:</b>

<button onclick="setzeBeispiel('habe')">
habe
</button>

<button onclick="setzeBeispiel('Mul')">
Mul
</button>

</div>


<pre id="ergebnis"></pre>



<script>


// =======================
// K-Laut Wörterbuch
// =======================

const kVokabel = {

    "mul": {
        id: 102,
        k_laut: "ㅁㅜㄹ",
        sildam: "Mur",
        deutsch: "Wasser",
        hanmun: "水",
        hanmun_reading: "Mul-su"
    },


    "habe": {
        id: 101,
        k_laut: "ㅎㅏㅂㅔ",
        sildam: "Habe",
        deutsch: "haben",
        hanmun: "有",
        hanmun_reading: "Yu"
    }

};




// =======================
// Deutsch → K-Laut Mapping
// =======================

const mapDeutsch = {

"h":"ㅎ",
"a":"ㅏ",
"b":"ㅂ",
"e":"ㅔ",
"t":"ㅌ",
"g":"ㄱ",
"o":"ㅗ",
"u":"ㅜ",
"i":"ㅣ",
"ä":"ㅐ",
"ö":"ㅚ",
"ü":"ㅟ",

"n":"ㄴ",
"r":"ㄹ",
"m":"ㅁ",
"f":"ㅍ",
"s":"ㅅ",
"z":"ㅈ",
"j":"ㅈ",
"c":"ㅈ",
"p":"ㅂ",
"l":"ㄹ",

"jh":"ㅈ",
"ch":"ㅊ",
"sh":"ㅅ",

"oo":"ㅜ",
"ou":"ㅜ",

"on":"옹",
"an":"앙",
"en":"엉",
"in":"잉"

};




// =======================
// Deutsch umwandeln
// =======================

function umwandeln(){

    let w = document
    .getElementById("wort")
    .value
    .toLowerCase();


    document.getElementById("deutsch").innerText =
    w.split("").join(" · ");



    let k = w.split("").map(
        c => mapDeutsch[c] || "?"
    );


    document.getElementById("kbuchstaben").innerText =
    k.join(" · ");



    document.getElementById("hangul").innerText =
    k.join("");



    let rück = k.map(
        j =>
        Object.keys(mapDeutsch)
        .find(key => mapDeutsch[key] === j) || "?"
    );


    document.getElementById("zurueck").innerText =
    rück.join("");

}



// =======================
// K-Wort Suche
// =======================

function sucheKWort(){

    let wort = document
    .getElementById("kwort")
    .value
    .trim()
    .toLowerCase();



    if(kVokabel[wort]){


        let daten = kVokabel[wort];


        document.getElementById("ergebnis").innerText =

        "ID: " + daten.id +
        "\nK-Laut: " + daten.k_laut +
        "\nSildam: " + daten.sildam +
        "\nDeutsch: " + daten.deutsch +
        "\nHanmun: " + daten.hanmun +
        "\nLesung: " + daten.hanmun_reading;


    }

    else {


        document.getElementById("ergebnis").innerText =
        "Kein K-Wort gefunden";


    }

}




function setzeBeispiel(wort){

    document.getElementById("kwort").value = wort;

    sucheKWort();

}




window.onload = function(){

    console.log("K-Laut System geladen");

};



</script>

</body>
</html>
