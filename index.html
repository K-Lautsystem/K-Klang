<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>K-Laut System – habe + mul</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}
input, button {
    font-size: 18px;
    padding: 6px;
}
pre {
    background: #f0f0f0;
    padding: 12px;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>K-Laut System</h1>

<h2>Deutsch → K-Laut</h2>

<input id="wort" value="habe">
<button onclick="umwandeln()">Umwandeln</button>

<h3>Zerlegung</h3>
<pre id="deutsch"></pre>

<h3>K-Buchstaben</h3>
<pre id="kbuchstaben"></pre>

<h3>Hangul</h3>
<pre id="hangul"></pre>

<h3>Rückführung</h3>
<pre id="zurueck"></pre>

<hr>

<h2>K-Wort Wörterbuch</h2>

<input id="kwort" placeholder="Wort eingeben">
<button onclick="sucheKWort()">Suchen</button>

<div style="margin-top:10px;">
<b>Beispiele:</b>
<button onclick="setzeBeispiel('habe')">habe</button>
<button onclick="setzeBeispiel('mul')">mul</button>
</div>

<pre id="ergebnis"></pre>

<script>
// =======================
// Wörterbuch (NEU)
// =======================

const kVokabel = {

    "habe": {
        id: 101,
        k_laut: "ㅎㅏㅂㅔ",
        sildam: "Habe",
        deutsch: "haben",
        hanmun: "有",
        hanmun_reading: "Yu"
    },

    "mul": {
        id: 102,
        k_laut: "ㅁㅜㄹ",
        sildam: "Mur",
        deutsch: "Wasser",
        hanmun: "水",
        hanmun_reading: "Mul-su"
    }

};

// =======================
// Mapping
// =======================

const mapDeutsch = {
"h":"ㅎ","a":"ㅏ","b":"ㅂ","e":"ㅔ",
"m":"ㅁ","u":"ㅜ","l":"ㄹ"
};

// =======================
// Umwandlung
// =======================

function umwandeln() {
    let w = document.getElementById("wort").value.toLowerCase();

    document.getElementById("deutsch").innerText =
        w.split("").join(" · ");

    let k = w.split("").map(c => mapDeutsch[c] || "?");

    document.getElementById("kbuchstaben").innerText =
        k.join(" · ");
    
document.getElementById("hangul").innerText = kombiniereHangul(k);
    
    let rück = k.map(j =>
        Object.keys(mapDeutsch).find(key => mapDeutsch[key] === j) || "?"
    );

    document.getElementById("zurueck").innerText =
        rück.join("");
}

// =======================
// Wörterbuchsuche
// =======================

function sucheKWort() {
    let w = document.getElementById("kwort").value.trim().toLowerCase();

    if (kVokabel[w]) {
        let d = kVokabel[w];
        document.getElementById("ergebnis").innerText =
            "ID: " + d.id +
            "\nK-Laut: " + d.k_laut +
            "\nSildam: " + d.sildam +
            "\nDeutsch: " + d.deutsch +
            "\nHanmun: " + d.hanmun +
            "\nLesung: " + d.hanmun_reading;
    } else {
        document.getElementById("ergebnis").innerText =
            "Kein K-Wort gefunden";
    }
}

function setzeBeispiel(w) {
    document.getElementById("kwort").value = w;
    sucheKWort();
}
</script>

</body>
</html>
