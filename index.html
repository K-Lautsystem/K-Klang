<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>K-Laut System – habe + mul</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}
input, button {
    font-size: 18px;
    padding: 6px;
}
pre {
    background: #f0f0f0;
    padding: 12px;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>K-Laut System</h1>

<h2>Deutsch → K-Laut</h2>

<input id="wort" value="habe">
<button onclick="umwandeln()">Umwandeln</button>

<h3>Zerlegung</h3>
<pre id="deutsch"></pre>

<h3>K-Buchstaben</h3>
<pre id="kbuchstaben"></pre>

<h3>Hangul</h3>
<pre id="hangul"></pre>

<h3>Rückführung</h3>
<pre id="zurueck"></pre>

<hr>

<h2>K-Wort Wörterbuch</h2>

<input id="kwort" placeholder="Wort eingeben">
<button onclick="sucheKWort()">Suchen</button>

<div style="margin-top:10px;">
<b>Beispiele:</b>
<button onclick="setzeBeispiel('habe')">habe</button>
<button onclick="setzeBeispiel('mul')">mul</button>
</div>

<pre id="ergebnis"></pre>

<script>
// =======================
// Wörterbuch
// =======================

const kVokabel = {

    "habe": {
        id: 101,
        k_laut: "ㅎㅏㅂㅔ",
        sildam: "Habe",
        deutsch: "haben",
        hanmun: "有",
        hanmun_reading: "Yu"
    },

    "mul": {
        id: 102,
        k_laut: "ㅁㅜㄹ",
        sildam: "Mur",
        deutsch: "Wasser",
        hanmun: "水",
        hanmun_reading: "Mul-su"
    }

};

// =======================
// Mapping
// =======================

const mapDeutsch = {
"h":"ㅎ","a":"ㅏ","b":"ㅂ","e":"ㅔ",
"m":"ㅁ","u":"ㅜ","l":"ㄹ"
};

// =======================
// Umwandlung
// =======================

function umwandeln() {
    let w = document.getElementById("wort").value.toLowerCase();

    document.getElementById("deutsch").innerText =
        w.split("").join(" · ");

    let k = w.split("").map(c => mapDeutsch[c] || "?");

    document.getElementById("kbuchstaben").innerText =
        k.join(" · ");

    // ⭐ Hangul-Silbe erzeugen (물)
    document.getElementById("hangul").innerText =
        kombiniereHangul(k);

    let rück = k.map(j =>
        Object.keys(mapDeutsch).find(key => mapDeutsch[key] === j) || "?"
    );

    document.getElementById("zurueck").innerText =
        rück.join("");
}

// =======================
// Hangul-Silbenkombination
// =======================

function kombiniereHangul(k) {

    const initial = k[0];
    const vowel   = k[1];
    const final   = k[2];

    const baseInitial = {
        "ㄱ":0,"ㄲ":1,"ㄴ":2,"ㄷ":3,"ㄸ":4,"ㄹ":5,"ㅁ":6,"ㅂ":7,"ㅃ":8,"ㅅ":9,"ㅆ":10,
        "ㅇ":11,"ㅈ":12,"ㅉ":13,"ㅊ":14,"ㅋ":15,"ㅌ":16,"ㅍ":17,"ㅎ":18
    };

    const baseVowel = {
        "ㅏ":0,"ㅐ":1,"ㅑ":2,"ㅒ":3,"ㅓ":4,"ㅔ":5,"ㅕ":6,"ㅖ":7,"ㅗ":8,"ㅘ":9,"ㅙ":10,
        "ㅚ":11,"ㅛ":12,"ㅜ":13,"ㅝ":14,"ㅞ":15,"ㅟ":16,"ㅠ":17,"ㅡ":18,"ㅢ":19,"ㅣ":20
    };

    const baseFinal = {
        "":0,"ㄱ":1,"ㄲ":2,"ㄳ":3,"ㄴ":4,"ㄵ":5,"ㄶ":6,"ㄷ":7,"ㄹ":8,"ㄺ":9,"ㄻ":10,
        "ㄼ":11,"ㄽ":12,"ㄾ":13,"ㄿ":14,"ㅀ":15,"ㅁ":16,"ㅂ":17,"ㅄ":18,"ㅅ":19,
        "ㅆ":20,"ㅇ":21,"ㅈ":22,"ㅊ":23,"ㅋ":24,"ㅌ":25,"ㅍ":26,"ㅎ":27
    };

    let ini = baseInitial[initial] ?? 11;
    let vow = baseVowel[vowel] ?? 0;
    let fin = baseFinal[final] ?? 0;

    let code = 0xAC00 + (ini * 21 * 28) + (vow * 28) + fin;

    return String.fromCharCode(code);
}

// =======================
// Wörterbuchsuche
// =======================

function sucheKWort() {
    let w = document.getElementById("kwort").value.trim().toLowerCase();

    if (kVokabel[w]) {
        let d = kVokabel[w];
        document.getElementById("ergebnis").innerText =
            "ID: " + d.id +
            "\nK-Laut: " + d.k_laut +
            "\nSildam: " + d.sildam +
            "\nDeutsch: " + d.deutsch +
            "\nHanmun: " + d.hanmun +
            "\nLesung: " + d.hanmun_reading;
    } else {
        document.getElementById("ergebnis").innerText =
            "Kein K-Wort gefunden";
    }
}

function setzeBeispiel(w) {
    document.getElementById("kwort").value = w;
    sucheKWort();
}
</script>

</body>
</html>
