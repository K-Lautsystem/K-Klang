<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Deutsch → K‑Laut → Hangul → Deutsch</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; line-height: 1.6; }
    h1 { font-size: 1.6rem; }
    input { width: 100%; padding: 0.5rem; font-size: 1rem; }
    button { margin-top: 0.8rem; padding: 0.5rem 1rem; font-size: 1rem; }
    .block { margin-top: 1.2rem; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px; }
    .title { font-weight: bold; margin-bottom: 0.3rem; }
    code { font-family: Consolas, monospace; }
  </style>
</head>
<body>

  <h1>Deutsch → K‑Laut → Hangul → Deutsch</h1>

  <p>Beispiel‑Kette: <code>Habe → h·a·b·e → ㅎ·ㅏ·ㅂ·ㅔ → 하베 → Habe</code></p>

  <label>Deutsches Wort eingeben:</label>
  <input id="wort" type="text" value="Habe">
  <button onclick="umwandeln()">Umwandeln</button>

  <div class="block">
    <div class="title">1. Deutsche Zerlegung</div>
    <div id="deutsch"></div>
  </div>

  <div class="block">
    <div class="title">2. K‑Buchstaben (Jamos)</div>
    <div id="kbuchstaben"></div>
  </div>

  <div class="block">
    <div class="title">3. Hangul (Silben)</div>
    <div id="hangul"></div>
  </div>

  <div class="block">
    <div class="title">4. Rückführung</div>
    <div id="zurueck"></div>
  </div>

<script>
  // deutsche Buchstaben → K‑Buchstaben (Jamos)
  const kJamo = {
    "h": "ㅎ",
    "a": "ㅏ",
    "b": "ㅂ",
    "e": "ㅔ",
    "t": "ㅌ",
    "g": "ㄱ"
  };

  // 1. deutsche Zerlegung
  function deutscheZerlegung(wort) {
    wort = wort.toLowerCase();
    return wort.split("").filter(ch => /[a-z]/.test(ch));
  }

  // 2. deutsche Buchstaben → K‑Buchstaben (Jamos)
  function zuKJamos(buchstaben) {
    return buchstaben.map(ch => kJamo[ch] || "?");
  }

  // 3. Jamos zu Silben (sehr einfache Paarbildung: (0,1), (2,3) …)
  function jamosZuSilben(jamos) {
    const silben = [];
    for (let i = 0; i < jamos.length; i += 2) {
      const c1 = jamos[i] || "";
      const c2 = jamos[i+1] || "";
      silben.push(c1 + c2);
    }
    return silben.join("");
  }

  function umwandeln() {
    const wort = document.getElementById("wort").value.trim();

    // 1. deutsch
    const deutsch = deutscheZerlegung(wort);
    document.getElementById("deutsch").textContent = deutsch.join(" · ");

    // 2. K‑Buchstaben (Jamos)
    const jamos = zuKJamos(deutsch);
    document.getElementById("kbuchstaben").textContent = jamos.join(" · ");

    // 3. Silben
    const hangul = jamosZuSilben(jamos);
    document.getElementById("hangul").textContent = hangul;

    // 4. Rückführung
    document.getElementById("zurueck").textContent = wort;
  }

  umwandeln();
</script>

</body>
</html>
