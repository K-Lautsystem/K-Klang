<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>K-Laut System – habe + mul</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}
input, button {
    font-size: 18px;
    padding: 6px;
}
pre {
    background: #f0f0f0;
    padding: 12px;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>K-Laut System</h1>

<h2>Deutsch → K-Laut</h2>

<input id="wort" value="habe">
<button onclick="umwandeln()">Umwandeln</button>

<h3>Zerlegung</h3>
<pre id="deutsch"></pre>

<h3>K-Buchstaben</h3>
<pre id="kbuchstaben"></pre>

<h3>Hangul</h3>
<pre id="hangul"></pre>

<h3>Rückführung</h3>
<pre id="zurueck"></pre>

<hr>

<h2>K-Wort Wörterbuch</h2>

<input id="kwort" placeholder="Wort eingeben">
<button onclick="sucheKWort()">Suchen</button>
<button onclick="zeigeKWort('Kha')">Kha</button>
<button onclick="zeigeKWort('Muni')">Muni</button>
<button onclick="zeigeKWort('A-chim')">A-chim</button>
<button onclick="zeigeKWort('An-ninsiya')">An-ninsiya</button>
<button onclick="zeigeKWort('A')">A</button>

<div style="margin-top:10px;">
<b>Beispiele:</b>
<button onclick="setzeBeispiel('habe')">habe</button>
<button onclick="setzeBeispiel('mul')">mul</button>
</div>

<pre id="ergebnis"></pre>

<script>
// =======================
// Wörterbuch
// =======================

const kVokabel = {

    "habe": {
        id: 101,
        k_laut: "ㅎㅏㅂㅔ",
        sildam: "Habe",
        deutsch: "haben",
    },

    "mul": {
        id: 102,
        k_laut: "ㅁㅜㄹ",
        sildam: "Mur",
        deutsch: "Wasser",
        hanmun: "水",
        hanmun_reading: "Mul-su"
    }

};

// =======================
// Mapping
// =======================

const mapDeutsch = {
"h":"ㅎ","a":"ㅏ","b":"ㅂ","e":"ㅔ",
"m":"ㅁ","u":"ㅜ","l":"ㄹ"
};

const deutschKlang = {
  tag:    { klang: 'Ta-g',    klaut: '탁' },
  mutter: { klang: 'Mu-ter',  klaut: '무터' },
  vater:  { klang: 'Hwa-ter', klaut: '화터' },
  sonne:  { klang: 'Son-ne',  klaut: '손네' },                      
  haus:   { klang: 'Ha-us',   klaut: '하우스' },
  stern:  { klang: 'S-te-rn', klaut: '스테른' }
};    

const kWorte = {

  "A": {
    korean: "아",
    sildam: "अ",
    bedeutung: "Ah!, Anfang, Laut A"
  },

  "A-chim": {
    korean: "아침",
    sildam: "a + chim",
    bedeutung: "Morgen, Beginn des Lichts"
  },

  "An-ninsiya": {
    korean: "안녕하세요",
    basis: "안녕",
    bedeutung: "Gruß, Hallo, Frieden"
  },

  "Muni": {
    korean: "어머니 / 엄마 / 어미",
    sildam: "मुनि",
    bedeutung: "Mutter; Muni = weise Person"
  }

};

// =======================
// Umwandlung
// =======================

function umwandeln() {
    let w = document.getElementById("wort").value.toLowerCase();

    document.getElementById("deutsch").innerText =
        w.split("").join(" · ");

    let k = w.split("").map(c => mapDeutsch[c] || "?");

    document.getElementById("kbuchstaben").innerText =
        k.join(" · ");

    // ⭐ Spezielle Silbenbildung
    if (w === "mul") {
        document.getElementById("hangul").innerText = kombiniereMul(k);
    }
    else if (w === "habe") {
        document.getElementById("hangul").innerText = kombiniereHabe(k);
    }
    else {
        document.getElementById("hangul").innerText = k.join("");
    }

    let rück = k.map(j =>
        Object.keys(mapDeutsch).find(key => mapDeutsch[key] === j) || "?"
    );

    document.getElementById("zurueck").innerText =
        rück.join("");
}

// =======================
// MUL → 물
// =======================

function kombiniereMul(k) {
    const initial = k[0]; // ㅁ
    const vowel   = k[1]; // ㅜ
    const final   = k[2]; // ㄹ

    const baseInitial = {"ㅁ":6};
    const baseVowel   = {"ㅜ":13};
    const baseFinal   = {"ㄹ":8};

    let code = 0xAC00 + (6 * 21 * 28) + (13 * 28) + 8;
    return String.fromCharCode(code); // 물
}

// =======================
// HABE → 하베
// =======================

function kombiniereHabe(k) {
    // ㅎㅏ = 하
    let first = String.fromCharCode(0xAC00 + (18 * 21 * 28) + (0 * 28));

    // ㅂㅔ = 베
    let second = String.fromCharCode(0xAC00 + (7 * 21 * 28) + (5 * 28));

    return first + second; // 하베
}

// =======================
// Wörterbuchsuche
// =======================

function sucheKWort() {
    let w = document.getElementById("kwort").value.trim().toLowerCase();

    if (kVokabel[w]) {
        let d = kVokabel[w];
        document.getElementById("ergebnis").innerText =
            "ID: " + d.id +
            "\nK-Laut: " + d.k_laut +
            "\nSildam: " + d.sildam +
            "\nDeutsch: " + d.deutsch +
            "\nHanmun: " + d.hanmun +
            "\nLesung: " + d.hanmun_reading;
    } else {
        document.getElementById("ergebnis").innerText =
            "Kein K-Wort gefunden";
    }
}

function setzeBeispiel(w) {
    document.getElementById("kwort").value = w;
    sucheKWort();
}
</script>

</body>
</html>
